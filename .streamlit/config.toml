# Thème de l'application : voir docs/design_system.md
[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#EFF6FF"
secondaryBackgroundColor = "#DBEAFE"
textColor = "#0F172A"
linkColor = "#1E40AF"
borderColor = "#BFDBFE"
showWidgetBorder = true
showSidebarBorder = false
baseRadius = "10px"
font = "sans-serif"
headingFont = "serif"
baseFontSize = 18
headingFontSizes = ["2.5rem", "1.65rem", "1.4rem", "1.2rem", "1.1rem", "1rem"]
greenColor = "#16A34A"
redColor = "#DC2626"
orangeColor = "#EA580C"
blueColor = "#2563EB"
chartCategoricalColors = ["#2563EB", "#16A34A", "#EA580C", "#DC2626"]

[theme.sidebar]
backgroundColor = "#2563EB"
secondaryBackgroundColor = "#1E40AF"
textColor = "#FFFFFF"
linkColor = "#FFFFFF"
borderColor = "#1E40AF"
